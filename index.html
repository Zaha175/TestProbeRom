<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d6f0fc">
<title>Test Situații de Trafic — Mobil</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#112d70;background:#d6f0fc;font-size:16px}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{touch-action:manipulation}
.container{max-width:1150px;margin:auto;padding:clamp(12px,3vw,24px)}
h1{text-align:center;font-size:clamp(20px,4vw,28px);margin:8px 0 18px}
.top{display:flex;align-items:end;justify-content:center;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.settings{display:flex;flex-direction:column;gap:5px;max-width:100%}.settings label{font-weight:700}.settings input{width:105px;min-height:44px;border:1px solid #8aa9cc;border-radius:8px;padding:7px;background:white;color:#112d70}
.image-load{display:flex;flex-direction:column;gap:5px;min-width:0}.image-load label{font-weight:700}.image-load input{font-size:14px;max-width:290px}
.hint{font-size:13px;font-weight:400;margin:0;color:#375381;line-height:1.4}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
button{border:0;border-radius:10px;background:#0c2784;color:#fff7c7;font-weight:700;min-height:48px;padding:12px 18px;cursor:pointer}
button:disabled{background:#8193b0;color:#edf0f5;cursor:not-allowed}
.status{text-align:center;font-weight:700;min-height:24px;margin-bottom:10px}
.image-and-checkboxes{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,1fr);gap:18px;align-items:start}
.image-container{width:100%;aspect-ratio:7/5;position:relative;display:grid;place-items:center;overflow:hidden;background:#081125;border:2px solid white;border-radius:12px;min-height:200px}
#image{width:100%;height:100%;object-fit:contain;display:none}
.placeholder{color:#e0eaff;text-align:center;padding:16px;line-height:1.45;max-width:90%;font-size:clamp(14px,2.2vw,18px)}
.checkboxes{display:flex;flex-direction:column;gap:9px}
.checkboxes label{display:flex;gap:12px;align-items:center;min-height:52px;padding:10px 12px;border:1px solid #aec9e0;border-radius:10px;background:#f3faff;font-weight:700;cursor:pointer;line-height:1.3}
.checkboxes input{width:24px;height:24px;flex:0 0 24px;accent-color:#143da1;margin:0}
.result{display:none;background:#fff;border:2px solid #9db8dd;border-radius:12px;padding:18px;margin:16px 0;text-align:center;font-weight:700;line-height:1.6}
.result.visible{display:block}.notice{text-align:center;min-height:22px;font-size:14px;font-weight:normal;color:#375381}
@media(max-width:760px){.image-and-checkboxes{grid-template-columns:1fr;gap:12px}.image-container{aspect-ratio:7/5;min-height:unset}.checkboxes{gap:7px}.checkboxes label{min-height:48px;padding:9px 12px}.top{justify-content:stretch}.settings,.image-load{flex:1 1 180px}.controls{display:grid;grid-template-columns:1fr 1fr}.controls button{width:100%;padding:10px 7px}.container{padding:12px}h1{margin:6px 0 14px}}
@media(max-width:350px){.controls{grid-template-columns:1fr}.image-load input{max-width:230px}}
</style>
</head>
<body>
<main class="container">
<h1>TEST SITUAȚII DE TRAFIC</h1>
<div class="top">
  <div class="settings"><label for="displayTime">Durata afișării (secunde)</label><input type="number" id="displayTime" value="5" min="1" max="120" inputmode="numeric"></div>
  <div class="image-load"><label for="imageFiles">Imagini de pe telefon / PC (opțional)</label><input id="imageFiles" type="file" accept="image/*" multiple><p class="hint">Selectează 10 imagini (bild1–bild10). Fără selecție, aplicația folosește fișierele bild1.jpg … bild10.jpg din același folder.</p></div>
</div>
<div class="controls"><button id="startButton" type="button">Începe Testul</button><button id="nextButton" type="button" disabled>Următoarea Imagine →</button></div>
<div class="status" id="status" aria-live="polite">Pregătit pentru test · 10 imagini</div>
<div class="image-and-checkboxes">
 <div class="image-container" id="imageContainer"><img id="image" alt="Situație de trafic"><div class="placeholder" id="placeholder">Imaginea va apărea aici după începerea testului.</div></div>
 <div class="checkboxes" id="checkboxes">
  <label><input type="checkbox" id="option1">Pietoni, copii</label>
  <label><input type="checkbox" id="option2">Mașini</label>
  <label><input type="checkbox" id="option3">Bicicletă, motocicletă, moped</label>
  <label><input type="checkbox" id="option4">Indicatoare rutiere</label>
  <label><input type="checkbox" id="option5">Semafor</label>
 </div>
</div>
<div class="notice" id="notice" aria-live="polite"></div>
<div id="result" class="result" role="status" aria-live="polite"></div>
</main>
<script>
'use strict';
const startButton=document.getElementById('startButton');
const nextButton=document.getElementById('nextButton');
const displayTimeInput=document.getElementById('displayTime');
const fileInput=document.getElementById('imageFiles');
const image=document.getElementById('image');
const placeholder=document.getElementById('placeholder');
const status=document.getElementById('status');
const result=document.getElementById('result');
const notice=document.getElementById('notice');
const boxes=Array.from({length:5},(_,i)=>document.getElementById('option'+(i+1)));
const correctAnswers={1:[false,true,true,false,true],2:[true,true,false,true,false],3:[true,true,true,true,true],4:[true,false,true,true,true],5:[true,true,false,true,true],6:[false,true,false,true,true],7:[true,true,false,true,true],8:[true,true,false,true,false],9:[false,true,true,true,false],10:[true,true,false,true,true]};
const totalImages=10;
let currentImageIndex=0,totalCorrectAnswersCount=0,timer=null,session=0,localUrls=[];
function clearTimer(){if(timer!==null){clearTimeout(timer);timer=null;}}
function hideImage(message){image.style.display='none';image.removeAttribute('src');placeholder.textContent=message;placeholder.hidden=false;}
function cleanBoxes(){boxes.forEach(b=>b.checked=false);}
function naturalSort(a,b){return a.name.localeCompare(b.name,'ro',{numeric:true,sensitivity:'base'});}
fileInput.addEventListener('change',()=>{
  clearTimer();session++;
  localUrls.forEach(url=>URL.revokeObjectURL(url));localUrls=[];
  const files=Array.from(fileInput.files||[]).sort(naturalSort);
  if(files.length&&files.length!==totalImages){notice.textContent='Alege exact 10 imagini pentru cele 10 situații.';}
  else if(files.length){localUrls=files.map(f=>URL.createObjectURL(f));notice.textContent='10 imagini încărcate, în ordinea numelor de fișier.';}
  else{notice.textContent='Sunt utilizate fișierele bild1.jpg … bild10.jpg.';}
  startButton.disabled=false;nextButton.disabled=true;currentImageIndex=0;cleanBoxes();hideImage('Apasă „Începe Testul”.');status.textContent='Pregătit pentru test · 10 imagini';result.classList.remove('visible');
});
function showImage(index){
  clearTimer();const token=++session;const seconds=Math.min(120,Math.max(1,Number.parseInt(displayTimeInput.value,10)||5));
  displayTimeInput.value=seconds;
  placeholder.textContent='Se încarcă imaginea…';placeholder.hidden=false;image.style.display='none';
  const url=localUrls.length===10?localUrls[index-1]:`bild${index}.jpg`;
  image.onload=()=>{if(token!==session)return;image.style.display='block';placeholder.hidden=true;timer=setTimeout(()=>{if(token!==session)return;hideImage('Timpul a expirat. Bifează ce ai observat.');timer=null;},seconds*1000);};
  image.onerror=()=>{if(token!==session)return;clearTimer();hideImage(`Imaginea ${index} nu a fost găsită. Selectează cele 10 fotografii de mai sus sau pune bild${index}.jpg lângă fișierul HTML.`);};
  image.alt=`Situație de trafic ${index}`;
  image.src=url;
}
function startTest(){
  if(fileInput.files.length&&localUrls.length!==10){notice.textContent='Pentru încărcare manuală, selectează exact 10 imagini.';return;}
  clearTimer();currentImageIndex=1;totalCorrectAnswersCount=0;cleanBoxes();result.classList.remove('visible');
  startButton.disabled=true;nextButton.disabled=false;fileInput.disabled=true;status.textContent=`Imaginea 1 din ${totalImages}`;showImage(currentImageIndex);
}
function nextImage(){if(currentImageIndex<1||currentImageIndex>totalImages)return;
  const actual=boxes.map(b=>b.checked),expected=correctAnswers[currentImageIndex];
  totalCorrectAnswersCount+=actual.filter((a,i)=>a===expected[i]).length;
  clearTimer();session++;
  if(currentImageIndex<totalImages){currentImageIndex++;cleanBoxes();status.textContent=`Imaginea ${currentImageIndex} din ${totalImages}`;showImage(currentImageIndex);}
  else{
    const max=totalImages*5,percentage=totalCorrectAnswersCount/max*100;
    hideImage('Test încheiat. Poți începe un test nou.');
    result.textContent=`${percentage>=70?'Test trecut!':'Test picat.'} Ai identificat corect ${totalCorrectAnswersCount} din ${max} elemente (${percentage.toFixed(0)}%).`;
    result.classList.add('visible');status.textContent='Test finalizat';startButton.disabled=false;nextButton.disabled=true;fileInput.disabled=false;currentImageIndex=0;
    result.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}
startButton.addEventListener('click',startTest);nextButton.addEventListener('click',nextImage);
</script>
</body>
</html>
